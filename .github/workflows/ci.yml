name: ci
on:
  pull_request:
  push:
    branches: [main]
# Public repo: standard runners are free. No secrets are used or reachable here, including for fork PRs.
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Lint entries and package hashes
        run: node tools/lint-entries.mjs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - name: Tool tests
        run: node --test test/tools.test.mjs
