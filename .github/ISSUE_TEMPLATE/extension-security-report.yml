name: Extension security report
description: Report a malicious or unsafe extension. Do not include exploit details for unpatched Somnia bugs, use SECURITY.md for those.
labels: [security-report]
body:
  - type: input
    id: ext
    attributes: {label: Extension id and version}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: What does it do that it should not?}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Evidence (links, hashes, steps)}
